# Android cross-compilation.
#
# The NDK linker, C compiler and archiver are supplied by the Gradle build
# (android/app/build.gradle.kts), which resolves them from the pinned NDK under
# the Android SDK. Nothing machine-specific belongs in this file, so the same
# checkout builds on any machine and on CI.

[target.aarch64-linux-android]
# Android 15+ devices may use 16 KB memory pages; the NDK still defaults to 4 KB
# alignment, which triggers a compatibility warning and a slower fallback mode.
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
